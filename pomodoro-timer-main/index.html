<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>⏱️ Pomodoro Timer</title>
</head>
<body>
    <main class="flex items-center justify-center min-h-screen bg-gray-100">
        <div class=" max-w-md w-full bg-white rounded-xl w-96 shadow-xl p-8">

        <header class="bg-gray-800 rounded-t-xl text-white p-4 mb-4">
            <h1 class="text-2xl font-bold">Pomodoro Timer</h1>
        </header>
        <section class="text-center">
            <span id="timer" class="text-6xl font-bold text-center my-8">25:00</span>
        </section>
        <section class="flex justify-center space-x-4 my-4">
            <button id="start" class="bg-green-500 hover:bg-green-600 transition duration-300 text-white px-4 py-2 rounded font-semibold cursor-pointer">Start</button>
            <button id="pause" class="bg-yellow-500 hover:bg-yellow-600 transition duration-300 text-white px-4 py-2 rounded font-semibold cursor-pointer">Pause</button>
            <button id="reset" class="bg-red-500 hover:bg-red-600 transition duration-300 text-white px-4 py-2 rounded font-semibold cursor-pointer">Reset</button>
        </section>
        <section class="text-center my-4">
            <p>Ready to Focus!</p>
            </section>

            
        </div>

    </main>



    <script src="script.js"></script>
</body>
</html>
